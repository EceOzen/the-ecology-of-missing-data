<!DOCTYPE html>
<html lang="en" translate="no">
<head>
<meta name="google" content="notranslate">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Ecology of Missing Data</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Space+Mono:wght@400;700&display=swap');

  :root {
    --bg: #0f1511;
    --bg2: #141c17;
    --ink: #e7eadf;
    --moss: #4f8f59;
    --fade: #8aa58e;
    --border: #2a3a2f;
    --alive: #9be27b;
    --glow: #b7ff8a;
    --silent: #253029;
    --panel: #162019;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'EB Garamond', Georgia, serif;
    min-height: 100vh;
  }

  header {
    padding: 2.5rem 2rem 1.5rem;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
  }

  .eyebrow {
    font-family: 'Space Mono', monospace;
    font-size:0.80rem;
    letter-spacing: 0.18em;
    color: var(--fade);
    text-transform: uppercase;
    margin-bottom: 0.5rem;
  }

  h1 {
    font-size: clamp(1.5rem, 3.5vw, 2.5rem);
    font-weight: 400;
    line-height: 1.15;
    color: var(--ink);
  }

  h1 em { font-style: italic; color: var(--fade); }

  .subtitle {
    font-family: 'Space Mono', monospace;
    font-size:0.80rem;
    color: var(--fade);
    letter-spacing: 0.08em;
    margin-top: 0.4rem;
  }

  .main {
    position: relative;
    min-height: calc(100vh - 110px);
    overflow: hidden;
  }

  .map-area {
    padding: 1.5rem 2rem 1rem;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .map-instruction {
    font-family: 'Space Mono', monospace;
    font-size:0.80rem;
    color: var(--fade);
    letter-spacing: 0.1em;
    margin-bottom: 1rem;
  }

  #turkey-svg {
    width: 100%;
    max-width: 780px;
    height: auto;
    display: block;
  }

  .il {
    cursor: pointer;
    stroke: #0f1511;
    stroke-width: 0.4;
    transition: fill 0.5s, opacity 0.5s;
  }
  .il:hover { opacity: 0.8; }

  .il.region-marmara        { fill: #6fae63; }
  .il.region-aegean         { fill: #5f9d57; }
  .il.region-mediterranean  { fill: #55914e; }
  .il.region-blacksea       { fill: #4a8046; }
  .il.region-central        { fill: #3f6f3d; }
  .il.region-eastern        { fill: #2f5730; }
  .il.region-southeast      { fill: #253029; }

  #turkey-svg.species-mode .il {
    fill: var(--silent) !important;
    opacity: 1;
  }
  #turkey-svg.species-mode .il.present {
    fill: var(--s, var(--alive)) !important;
  }
  #turkey-svg.species-mode .il.missing {
    fill: var(--silent) !important;
    opacity: 0.55;
  }

  .species-panel {
    width: 100%;
    max-width: 780px;
    margin: 1.2rem auto 0;
    padding-left: 1rem; padding-right: 1rem;
    box-sizing: border-box;
    padding-top: 1rem;
    border-top: 1px solid var(--border);
  }
  .species-select-row {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    flex-wrap: wrap;
  }
  .species-dropdown {
    font-family: 'Space Mono', monospace;
    font-size:0.80rem;
    background: var(--panel);
    color: var(--ink);
    border: 1px solid var(--border);
    padding: 0.45rem 0.6rem;
    letter-spacing: 0.02em;
    max-width: 100%;
    flex: 1;
    min-width: 220px;
  }
  .species-waveform-label {
    font-family: 'Space Mono', monospace;
    font-size:0.80rem;
    color: var(--fade);
    letter-spacing: 0.05em;
    margin-top: 0.7rem;
    min-height: 1em;
  }
  .species-waveform {
    display: flex;
    align-items: flex-end;
    gap: 2px;
    height: 34px;
    margin-top: 0.4rem;
  }

  .region-overlay {
    cursor: pointer;
    transition: opacity 0.3s;
  }
  .region-overlay:hover { opacity: 0.75 !important; }

  @keyframes glitch {
    0%,88%,100% { transform:translate(0,0); opacity:0.12; }
    90% { transform:translate(-1px,1px); opacity:0.07; }
    93% { transform:translate(1px,-1px); opacity:0.17; }
    96% { transform:translate(-1px,0); opacity:0.05; }
  }
  .glitch-anim { animation: glitch 5s infinite; }

  @keyframes breathe {
    0%,100% { opacity:0.72; }
    50% { opacity:0.55; }
  }
  .breathe-anim { animation: breathe 3s ease-in-out infinite; }

  .legend {
    display: flex;
    gap: 1.2rem;
    margin-top: 1rem;
    flex-wrap: wrap;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-family: 'Space Mono', monospace;
    font-size:0.80rem;
    color: var(--fade);
    letter-spacing: 0.06em;
  }
  .legend-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }

  .side-panel {
    position: absolute;
    top: 0;
    right: 0;
    width: min(360px, 92vw);
    height: 100%;
    border-left: 1px solid var(--border);
    background: rgba(236, 233, 224, 0.96);
    backdrop-filter: blur(8px);
    padding: 1.5rem 1.2rem;
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
    overflow-y: auto;
    transform: translateX(105%);
    transition: transform 0.45s ease;
    box-shadow: -20px 0 50px rgba(26, 31, 26, 0.08);
    z-index: 10;
  }

  .side-panel.open {
    transform: translateX(0);
  }

  .panel-close {
    position: absolute;
    top: 0.8rem;
    right: 0.9rem;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--fade);
    font-family: 'Space Mono', monospace;
    font-size:0.80rem;
    width: 1.7rem;
    height: 1.7rem;
    cursor: pointer;
    line-height: 1;
  }

  .panel-close:hover {
    color: var(--glow);
    border-color: var(--glow);
  }

  .panel-hint {
    position: absolute;
    right: 2rem;
    bottom: 1.4rem;
    max-width: 250px;
    font-family: 'Space Mono', monospace;
    font-size:0.80rem;
    color: var(--fade);
    letter-spacing: 0.06em;
    line-height: 1.6;
    text-align: right;
  }

  .placeholder {
    font-size:0.95rem;
    color: #9aaa9a;
    font-style: italic;
    line-height: 1.7;
    padding-top: 0.5rem;
  }

  .region-name {
    font-family: 'Space Mono', monospace;
    font-size:0.80rem;
    color: var(--glow);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    margin-bottom: 0.6rem;
  }

  .region-stat {
    font-size: 2rem;
    font-weight: 400;
    line-height: 1;
    margin-bottom: 0.2rem;
    color: var(--ink);
  }

  .region-stat-label {
    font-family: 'Space Mono', monospace;
    font-size:0.80rem;
    color: var(--fade);
    letter-spacing: 0.08em;
    margin-bottom: 1.2rem;
  }

  .region-desc {
    font-size:0.90rem;
    line-height: 1.65;
    color: #4a6a4a;
    margin-bottom: 1rem;
  }

  .timeline-label {
    font-family: 'Space Mono', monospace;
    font-size:0.80rem;
    color: var(--fade);
    letter-spacing: 0.08em;
    margin-bottom: 0.4rem;
  }

  .timeline {
    display: flex;
    gap: 2px;
    align-items: flex-end;
    height: 36px;
    margin-bottom: 0.2rem;
  }

  .tbar { flex: 1; border-radius: 1px 1px 0 0; min-height: 2px; }

  .timeline-years {
    display: flex;
    justify-content: space-between;
    font-family: 'Space Mono', monospace;
    font-size:0.80rem;
    color: var(--fade);
  }

  .sound-section { border-top: 1px solid var(--border); padding-top: 1.2rem; }

  .sound-label {
    font-family: 'Space Mono', monospace;
    font-size:0.80rem;
    color: var(--fade);
    letter-spacing: 0.1em;
    margin-bottom: 0.6rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .sound-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--fade);
    font-family: 'Space Mono', monospace;
    font-size:0.80rem;
    padding: 0.2rem 0.5rem;
    cursor: pointer;
    letter-spacing: 0.08em;
    transition: all 0.2s;
  }
  .sound-btn:hover, .sound-btn.on {
    border-color: var(--glow);
    color: var(--glow);
    background: #e0ece0;
  }

  .waveform {
    display: flex;
    gap: 2px;
    align-items: center;
    height: 28px;
  }

  .wbar { flex: 1; border-radius: 1px; transition: height 0.3s, opacity 0.5s, background 0.5s; }

  @keyframes wv {
    0%,100% { height: var(--wh); }
    50% { height: calc(var(--wh) * 0.25); }
  }
  .wbar.on { animation: wv 0.7s ease-in-out infinite; }

  .quote-box {
    border-left: 2px solid var(--border);
    padding: 0.7rem 0.9rem;
    font-style: italic;
    font-size:0.88rem;
    line-height: 1.6;
    color: var(--fade);
  }

  footer {
    padding: 1rem 2rem;
    border-top: 1px solid var(--border);
    background: var(--bg);
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 0.5rem;
  }

  .footer-text {
    font-family: 'Space Mono', monospace;
    font-size:0.80rem;
    color: var(--fade);
    letter-spacing: 0.06em;
  }




  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(circle at 22% 18%, rgba(155,226,123,0.07), transparent 24%),
      radial-gradient(circle at 78% 72%, rgba(183,255,138,0.05), transparent 28%),
      linear-gradient(180deg, rgba(255,255,255,0.02), transparent 45%);
    z-index: 0;
  }

  header, .main, footer { position: relative; z-index: 1; }

  .map-area {
    background:
      radial-gradient(circle at center, rgba(88,128,86,0.08), transparent 58%),
      var(--bg);
  }

  #turkey-svg {
    filter: drop-shadow(0 0 22px rgba(155,226,123,0.12));
  }

  .observation-star {
    fill: var(--glow);
    opacity: 0.64;
    pointer-events: none;
    filter: drop-shadow(0 0 5px rgba(183,255,138,0.95));
    transition: opacity 0.45s, transform 0.45s;
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0.28; transform: scale(0.85); }
    50% { opacity: 0.88; transform: scale(1.18); }
  }

  .observation-star.twinkle {
    animation: twinkle 2.7s ease-in-out infinite;
  }

  .ghost-species-mark {
    font-size: 27px;
    fill: rgba(231,234,223,0.13);
    stroke: rgba(183,255,138,0.16);
    stroke-width: 0.4;
    filter: blur(0.25px) drop-shadow(0 0 14px rgba(183,255,138,0.18));
    pointer-events: none;
    transition: opacity 0.5s, filter 0.5s;
  }

  .ghost-label {
    font-family: 'Space Mono', monospace;
    font-size: 5px;
    fill: rgba(231,234,223,0.35);
    letter-spacing: 0.08em;
    pointer-events: none;
  }

  .side-panel, .left-panel {
    background: rgba(22, 32, 25, 0.94);
    color: var(--ink);
  }

  .placeholder,
  .region-desc,
  .species-item,
  .satellite-note,
  .absence-line,
  .quote-box {
    color: #b8cbb8;
  }

  .region-stat { color: var(--ink); }

  .sound-btn, .panel-close, .zoom-reset {
    background: #111914;
  }

  .satellite-crop {
    border-color: #345040;
    box-shadow: inset 0 0 38px rgba(0,0,0,0.45), 0 0 22px rgba(183,255,138,0.05);
  }

  .satellite-crop::after {
    box-shadow: inset 0 0 70px rgba(0,0,0,0.55);
  }

  .legend-dot {
    box-shadow: 0 0 7px rgba(183,255,138,0.28);
  }

  .time-control {
    background: rgba(22, 32, 25, 0.76);
  }

  .time-caption { color: #a8bea8; }

  .time-control {
    width: min(720px, 92vw);
    margin-top: 0.9rem;
    border: 1px solid var(--border);
    background: rgba(236, 233, 224, 0.72);
    padding: 0.75rem 0.9rem;
  }

  .time-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
    margin-bottom: 0.45rem;
  }

  .time-label {
    font-family: 'Space Mono', monospace;
    font-size:0.80rem;
    color: var(--fade);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .time-year {
    font-family: 'Space Mono', monospace;
    font-size:0.80rem;
    color: var(--glow);
    letter-spacing: 0.12em;
  }

  #year-slider {
    width: 100%;
    accent-color: var(--glow);
  }

  .time-caption {
    font-size:0.80rem;
    color: #5a745a;
    margin-top: 0.45rem;
    font-style: italic;
  }

  .species-item.ghost {
    opacity: var(--ghost-opacity, 0.45);
    filter: blur(var(--ghost-blur, 0.4px));
    transition: opacity 0.45s, filter 0.45s;
  }

  .species-item.ghost .species-note::after {
    content: " · confidence fading";
  }

  .absence-line {
    margin-top: 0.8rem;
    border-top: 1px solid var(--border);
    padding-top: 0.8rem;
    font-size:0.86rem;
    line-height: 1.55;
    color: #4a6a4a;
    font-style: italic;
  }

  .map-area.dim-silence .region-overlay {
    opacity: calc(var(--base-opacity, 0.25) * var(--time-factor, 1));
  }

  .map-viewport {
    width: 100%;
    max-width: 860px;
    overflow: hidden;
    display: flex;
    justify-content: center;
    border: 1px solid transparent;
  }

  #turkey-svg {
    transform-origin: center center;
    transition: transform 0.9s ease;
  }

  #turkey-svg.zoom-marmara { transform: scale(2.9) translate(26%, 26%); }
  #turkey-svg.zoom-aegean { transform: scale(2.35) translate(28%, -4%); }
  #turkey-svg.zoom-mediterranean { transform: scale(2.1) translate(8%, -20%); }
  #turkey-svg.zoom-blacksea { transform: scale(2.1) translate(-2%, 28%); }
  #turkey-svg.zoom-central { transform: scale(2.25) translate(-2%, 3%); }
  #turkey-svg.zoom-eastern { transform: scale(1.95) translate(-25%, 5%); }
  #turkey-svg.zoom-southeast { transform: scale(2.05) translate(-22%, -19%); }

  .left-panel {
    position: absolute;
    top: 0;
    left: 0;
    width: min(350px, 92vw);
    height: 100%;
    border-right: 1px solid var(--border);
    background: rgba(236, 233, 224, 0.96);
    backdrop-filter: blur(8px);
    padding: 1.5rem 1.2rem;
    transform: translateX(-105%);
    transition: transform 0.45s ease;
    box-shadow: 20px 0 50px rgba(26, 31, 26, 0.08);
    z-index: 11;
    overflow-y: auto;
  }

  .left-panel.open {
    transform: translateX(0);
  }

  .satellite-title {
    font-family: 'Space Mono', monospace;
    font-size:0.80rem;
    color: var(--fade);
    letter-spacing: 0.1em;
    margin-bottom: 0.65rem;
    text-transform: uppercase;
  }

  .satellite-crop {
    height: 210px;
    border: 1px solid var(--border);
    margin-bottom: 0.8rem;
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(circle at 25% 30%, rgba(37,98,37,.72), transparent 18%),
      radial-gradient(circle at 60% 48%, rgba(78,113,78,.58), transparent 24%),
      radial-gradient(circle at 42% 72%, rgba(155,128,78,.42), transparent 22%),
      linear-gradient(135deg, #224422 0%, #6f8a63 42%, #b6a173 66%, #344f39 100%);
    filter: saturate(0.8) contrast(1.08);
  }

  .satellite-crop::before {
    content: "";
    position: absolute;
    inset: -20%;
    background:
      repeating-linear-gradient(35deg, rgba(255,255,255,0.06) 0 1px, transparent 1px 8px),
      repeating-linear-gradient(95deg, rgba(0,0,0,0.05) 0 1px, transparent 1px 14px);
    mix-blend-mode: overlay;
    opacity: .7;
  }

  .satellite-crop::after {
    content: "";
    position: absolute;
    inset: 0;
    background: var(--sat-mask, radial-gradient(circle at 50% 50%, transparent, rgba(242,239,230,.18)));
  }

  .satellite-crop.marmara {
    background:
      linear-gradient(18deg, #274a2d 0 28%, #1f3548 29% 45%, #6d7f55 46% 70%, #394a2e 71% 100%);
    --sat-mask: radial-gradient(circle at 50% 35%, transparent 0 44%, rgba(242,239,230,.24) 76%);
  }

  .satellite-crop.aegean {
    background:
      radial-gradient(circle at 35% 55%, #1f4e65 0 20%, transparent 21%),
      linear-gradient(130deg, #7f8b52 0 36%, #224c58 37% 55%, #9a8660 56% 100%);
  }

  .satellite-crop.mediterranean {
    background:
      linear-gradient(20deg, #214f60 0 30%, #927b54 31% 55%, #496e3d 56% 100%);
  }

  .satellite-crop.blacksea {
    background:
      linear-gradient(172deg, #1e3f54 0 28%, #173d20 29% 80%, #6b8a54 81% 100%);
  }

  .satellite-crop.central {
    background:
      radial-gradient(circle at 54% 48%, #d6cec2 0 20%, #9d8a63 21% 35%, transparent 36%),
      linear-gradient(35deg, #a98f62 0%, #c0ad7a 45%, #747c4a 100%);
  }

  .satellite-crop.eastern {
    background:
      radial-gradient(circle at 30% 20%, rgba(235,235,220,.7), transparent 12%),
      linear-gradient(140deg, #5e704b 0%, #8f8a70 35%, #4f633f 70%, #b9b4a6 100%);
  }

  .satellite-crop.southeast {
    background:
      linear-gradient(140deg, #a98f62 0%, #c9b07c 44%, #5b794f 45% 62%, #947a51 63% 100%);
  }

  .satellite-note {
    font-size:0.84rem;
    line-height: 1.55;
    color: #4a6a4a;
    margin-bottom: 0.9rem;
  }

  .zoom-reset {
    position: fixed;
    left: 1rem;
    bottom: 1rem;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--fade);
    font-family: 'Space Mono', monospace;
    font-size:0.80rem;
    padding: 0.35rem 0.6rem;
    cursor: pointer;
    letter-spacing: 0.08em;
    z-index: 9;
  }

  .zoom-reset:hover {
    color: var(--glow);
    border-color: var(--glow);
  }

  @media (max-width: 680px) {
    .left-panel {
      width: 100%;
      border-right: none;
      border-bottom: 1px solid var(--border);
    }
    .zoom-reset { left: 1rem; bottom: 3.8rem; }
  }

  @media (max-width: 680px) {
    .map-area { padding: 1.2rem 1rem 1rem; }
    .side-panel {
      width: 100%;
      border-left: none;
      border-top: 1px solid var(--border);
    }
    .panel-hint {
      left: 1rem;
      right: 1rem;
      text-align: left;
      bottom: 0.8rem;
      max-width: none;
    }
  }


  .species-box {
    border-top: 1px solid var(--border);
    padding-top: 1rem;
    margin-top: 1rem;
  }

  .species-title {
    font-family: 'Space Mono', monospace;
    font-size:0.80rem;
    color: var(--fade);
    letter-spacing: 0.1em;
    margin-bottom: 0.65rem;
    text-transform: uppercase;
  }

  .species-list {
    display: flex;
    flex-direction: column;
    gap: 0.45rem;
  }

  .species-item {
    display: grid;
    grid-template-columns: 1.4rem 1fr;
    gap: 0.45rem;
    align-items: start;
    font-size:0.84rem;
    line-height: 1.35;
    color: #4a6a4a;
  }

  .species-icon {
    font-size:0.95rem;
    opacity: 0.85;
  }

  .species-note {
    font-family: 'Space Mono', monospace;
    font-size:0.80rem;
    letter-spacing: 0.05em;
    color: var(--fade);
    margin-top: 0.05rem;
  }

  /* Migratory bird flight layer */
  @keyframes birdFlight {
    0% { offset-distance: 0%; opacity: 0; }
    8% { opacity: 0.85; }
    72% { opacity: 0.85; }
    100% { offset-distance: 100%; opacity: 0; }
  }

  .bird {
    font-size: 13px;
    fill: #1f3d1f;
    opacity: 0;
    offset-rotate: auto;
    animation: birdFlight 9s linear infinite;
    pointer-events: none;
  }

  .bird.b1 {
    offset-path: path("M95,238 C170,185 245,125 390,55 C475,20 555,55 655,110");
    animation-delay: 0s;
  }

  .bird.b2 {
    offset-path: path("M75,210 C145,170 230,150 348,158 C470,166 565,145 680,185");
    animation-delay: 2.2s;
    animation-duration: 10.5s;
    opacity: 0;
  }

  .bird.b3 {
    offset-path: path("M105,140 C180,95 270,85 390,55 C515,28 610,72 715,145");
    animation-delay: 4.4s;
    animation-duration: 11.5s;
    opacity: 0;
  }

  .flight-path {
    fill: none;
    stroke: #2d5a2d;
    stroke-width: 0.7;
    stroke-dasharray: 3 5;
    opacity: 0.22;
    pointer-events: none;
  }

function parseGoogleForm(link) {
  // pre-filled link: .../forms/d/e/<ID>/viewform?usp=pp_url&entry.111=TYPE&entry.222=NAME&...
  try {
    const u = new URL(link), m = u.pathname.match(/\/forms\/d\/e\/([^/]+)/);
    if (!m) return null;
    const map = {};
    u.searchParams.forEach((v, k) => { if (k.startsWith('entry.')) map[v.toUpperCase()] = k; });
    return { action: 'https://docs.google.com/forms/d/e/' + m[1] + '/formResponse', entries: map };
  } catch (e) { return null; }
}

const initials = n => n.split(/\s+/).filter(Boolean).slice(0,2).map(s => s[0]).join('').toUpperCase();
function avatar(m, cls) {
  const wrap = document.createElement('span'); wrap.style.display = 'contents';
  const fallback = () => { const d = document.createElement('span'); d.className = cls; d.textContent = initials(m.name); return d; };
  if (!m.photo) { wrap.appendChild(fallback()); return wrap; }
  const img = document.createElement('img'); img.className = cls; img.alt = m.name; img.src = m.photo;
  img.onerror = () => img.replaceWith(fallback());
  wrap.appendChild(img); return wrap;
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  body.insertAdjacentHTML('beforeend', '<h4>' + esc(m.name) + '</h4><span class="role">' + esc(role) + '</span><p>' + esc(bio) + '</p>' +

  document.getElementById('tmodal').hidden = false;
}

let season = 'autumn', migSel = 'bosphorus', migReady = false;
const mx = lon => (lon - MIG.bounds[0]) / (MIG.bounds[2] - MIG.bounds[0]) * 760 + 10;
const my = lat => (MIG.bounds[3] - lat) / (MIG.bounds[3] - MIG.bounds[1]) * 290 + 10;
function smoothPath(pts) {   // Catmull-Rom -> cubic Bezier
  const P = pts.map(p => [mx(p[0]), my(p[1])]);
  let d = 'M ' + P[0][0].toFixed(1) + ',' + P[0][1].toFixed(1);
  for (let i = 0; i < P.length - 1; i++) {
    const p0 = P[i - 1] || P[i], p1 = P[i], p2 = P[i + 1], p3 = P[i + 2] || p2;
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
    const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += ' C ' + c1.map(v => v.toFixed(1)).join(',') + ' ' + c2.map(v => v.toFixed(1)).join(',') + ' ' + p2.map(v => v.toFixed(1)).join(',');
  }
  return d;
}
function initMig() {
  const svg = document.getElementById('mig-svg'), src = document.getElementById('turkey-svg');
  const first = svg.firstChild;
  src.querySelectorAll('path.il').forEach(p => {

    c.classList.remove('sel'); svg.insertBefore(c, first);
  });
  migReady = true; renderMig();
}
function setSeason(s) { season = s; renderMig(); }
function selectCorridor(id) { migSel = id; renderMig(); }
function goSpecies(key) {

function renderMig() {
  if (!migReady) return;
  const NS = 'http://www.w3.org/2000/svg';
  document.getElementById('mig-svg').classList.toggle('plain', !document.getElementById('mig-quiet').checked);
  document.getElementById('seas-a').classList.toggle('on', season === 'autumn');
  document.getElementById('seas-s').classList.toggle('on', season === 'spring');
  const g = document.getElementById('mig-routes'); g.innerHTML = '';
  MIG.corridors.forEach(c => {
    const pts = season === 'autumn' ? c.pts : [...c.pts].reverse();
    const d = smoothPath(pts);
    const path = document.createElementNS(NS, 'path'); path.setAttribute('d', d);
    path.setAttribute('class', 'route' + (c.id === migSel ? ' on' : '')); g.appendChild(path);
    for (let i = 0; i < 7; i++) {
      const dot = document.createElementNS(NS, 'circle'); dot.setAttribute('r', c.id === migSel ? 2.6 : 1.8); dot.setAttribute('class', 'dot');
      const am = document.createElementNS(NS, 'animateMotion');
      am.setAttribute('dur', '9s'); am.setAttribute('repeatCount', 'indefinite'); am.setAttribute('begin', (-i * 9 / 7).toFixed(2) + 's'); am.setAttribute('path', d);
      dot.appendChild(am); g.appendChild(dot);
    }
  });
  const sg = document.getElementById('mig-sites'); sg.innerHTML = '';
  MIG.sites.forEach(s => {
    const gg = document.createElementNS(NS, 'g'); gg.setAttribute('class', 'site');
    gg.innerHTML = '<circle cx="' + mx(s.lon).toFixed(1) + '" cy="' + my(s.lat).toFixed(1) + '" r="3.2"/><text x="' + (mx(s.lon) + 5).toFixed(1) + '" y="' + (my(s.lat) - 4).toFixed(1) + '">' + s.n + '</text>';
    sg.appendChild(gg);

  // side cards
  const side = document.getElementById('mig-side'); side.innerHTML = '';
  MIG.corridors.forEach(c => {
    const [title, desc] = t('c_' + c.id);
    const bins = c.cross.map(n => ilStats[n] ? densBin(n) : 0);
    const quiet = bins.filter(b => b <= 1).length;
    const strip = c.cross.map((n, i) => '<span style="background:' + DENS_COLORS[bins[i]] + '" title="' + n + ': ' + (ilStats[n] ? fmt(per100(n)) : '—') + ' / 100 km²"></span>').join('');
    const chips = c.species.map(([lat, en]) => {

    }).join('');
    const card = document.createElement('div'); card.className = 'mig-card' + (c.id === migSel ? ' on' : '');
    card.onclick = () => selectCorridor(c.id);
    card.innerHTML = '<h4>' + title + '</h4><p>' + desc + '</p>' +
      '<div class="chips">' + chips + '</div>' +

      '<div class="fine" style="color:#f2c36b">' + t('mig_quiet', quiet, c.cross.length) + '</div>';

function composeMail() {
  const ty = document.getElementById('c-type');
  const typeEn = PAGES.en.c_types[ty.selectedIndex];
  const f = id => document.getElementById(id).value.trim();
  const subject = '[Missing Data] ' + typeEn;
  const body = 'Type: ' + typeEn + '\nName: ' + f('c-name') + '\nE-mail: ' + f('c-email') +
    '\nSpecies / province: ' + f('c-where') + '\nLanguage: ' + LANG + '\n\n' + f('c-msg');
  return { subject, body };
}
async function sendMail(ev) {
  ev.preventDefault();
  const msg = document.getElementById('c-msg').value.trim();
  if (!msg) { alert(t('c_empty')); return false; }
  const { subject, body } = composeMail();
  if (GFORM) {
    const st = document.getElementById('c-status'); st.className = 'fine'; st.textContent = t('c_sending');
    const f = id => document.getElementById(id).value.trim();
    const typeEn = PAGES.en.c_types[document.getElementById('c-type').selectedIndex];
    const vals = { TYPE: typeEn, NAME: f('c-name'), EMAIL: f('c-email'), WHERE: f('c-where'), MSG: msg, LANG: LANG };
    const data = new URLSearchParams();
    Object.keys(vals).forEach(k => { if (GFORM.entries[k]) data.append(GFORM.entries[k], vals[k]); });
    try {
      await fetch(GFORM.action, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: data.toString() });
      st.className = 'fine ok'; st.textContent = t('c_ok'); document.getElementById('cform').reset();
    } catch (e) { st.className = 'fine err'; st.textContent = t('c_fail'); }
    return false;
  }
  if (!FORM.accessKey) {   // no backend configured: fall back to the e-mail app
    window.location.href = 'mailto:' + CONTACT + '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
    return false;
  }
  const st = document.getElementById('c-status'); st.className = 'fine'; st.textContent = t('c_sending');
  try {
    const f = id => document.getElementById(id).value.trim();
    const res = await fetch('https://api.web3forms.com/submit', {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify({
        access_key: FORM.accessKey, subject: subject, from_name: f('c-name') || 'Missing Data visitor',
        email: f('c-email') || undefined, message: body, botcheck: document.getElementById('c-bot').value
      })
    });
    const j = await res.json();
    if (j.success) { st.className = 'fine ok'; st.textContent = t('c_ok'); document.getElementById('cform').reset(); }
    else throw new Error(j.message || 'failed');
  } catch (e) { st.className = 'fine err'; st.textContent = t('c_fail'); }
  return false;
}
function copyMsg() {
  const { subject, body } = composeMail();

  const btn = document.getElementById('c-copy');

const ilStats = /*__IL_STATS__*/null;
const ilNames = Object.keys(ilStats);
const per100 = n => ilStats[n].records / ilStats[n].area * 100;
const fmt = n => Math.round(n).toLocaleString(t('loc'));
const SP_COLORS = ['#3b7a48','#53994f','#72b85a','#9be27b','#d2ffa8'];
const DENS_COLORS = ['#1b2820','#27432f','#35693d','#5a9c4c','#9be27b'];
const densLo = Math.log10(Math.min(...ilNames.map(per100)));
const densHi = Math.log10(Math.max(...ilNames.map(per100)));
const densBin = n => Math.min(4, Math.floor((Math.log10(per100(n)) - densLo) / (densHi - densLo) * 5));

function densityLegend() {
  return '<div class="legend-item">' + t('d_lo') + '</div>' +

    '<div class="legend-item">' + t('d_hi') + '</div>';
}

function paintDensity() {
  document.querySelectorAll('#turkey-svg .il').forEach(p => {
    const n = p.getAttribute('data-il');
    if (ilStats[n]) p.style.setProperty('--d', DENS_COLORS[densBin(n)]);
  });
  document.getElementById('turkey-svg').classList.add('density-mode');
  document.getElementById('map-legend').innerHTML = densityLegend();
}

const presentIn = (key, il) => (speciesData.presentCounts[key] || {})[il] > 0;
const neighbourHas = (key, il) => ilStats[il].nb.some(n => presentIn(key, n));

function ghostsFor(il) {
  const need = ilStats[il].nb.length <= 2 ? 1 : 2;
  return [...speciesData.speciesList]
    .filter(s => !presentIn(s.key, il) && ilStats[il].nb.filter(n => presentIn(s.key, n)).length >= need)
    .sort((a, b) => b.national - a.national);
}

/* ---------- waveform = the actual west->east profile of 81 provinces ---------- */
let levels = [];
function buildProfile(counts, maxCount, key) {
  const swf = document.getElementById('species-waveform');
  swf.innerHTML = '';
  levels = ilOrderWestEast.map(il => {
    const c = counts[il] || 0;
    return c > 0 ? Math.max(0.12, Math.log1p(c) / Math.log1p(maxCount)) : 0;
  });
  ilOrderWestEast.forEach((il, i) => {
    const b = document.createElement('div');
    const ghost = key && levels[i] === 0 && neighbourHas(key, il);
    b.className = 'sbar' + (levels[i] > 0 ? ' hit' : ghost ? ' ghostbar' : '');
    b.style.height = Math.max(2, levels[i] * 38) + 'px';
    swf.appendChild(b);
  });
}

/* ---------- travelling playhead + sound ---------- */
let travelInterval = null, travelIdx = 0, audioOn = false, audioCtx = null;
const SCALE = [0, 2, 4, 7, 9];
function playTone(level) {
  if (!audioOn || !audioCtx || level <= 0) return;   // no record = true silence
  const steps = Math.round(level * 14);
  const note = SCALE[steps % 5] + 12 * Math.floor(steps / 5);
  const f = 196 * Math.pow(2, note / 12);
  const t = audioCtx.currentTime;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = 'triangle'; o.frequency.value = f;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.05 + 0.13 * level, t + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.45);
  o.connect(g).connect(audioCtx.destination);
  o.start(t); o.stop(t + 0.5);
}

/* bird recording (Xeno-canto): the call fades in over provinces with records, silence where there are none */
let birdAudio = null;
const xcOf = key => { const sp = speciesData.speciesList.find(x => x.key === key); return sp && sp.xc; };
function xcCredit(xc) { return xc ? ('Xeno-canto XC' + xc.id + (xc.r ? ' · ' + xc.r : '') + (xc.l ? ' · CC ' + xc.l : '')) : ''; }
function stopBird() { if (birdAudio) { try { birdAudio.pause(); } catch (e) {} birdAudio = null; } const c = document.getElementById('bird-credit'); if (c) c.textContent = ''; }
function birdStart(key) {
  stopBird();
  const xc = xcOf(key); if (!xc) return false;
  try { birdAudio = new Audio(xc.f); birdAudio.loop = true; birdAudio.volume = 0; const pr = birdAudio.play(); if (pr && pr.catch) pr.catch(() => {}); } catch (e) { birdAudio = null; return false; }
  const c = document.getElementById('bird-credit'); if (c) c.textContent = '♪ ' + xcCredit(xc);
  return true;
}
function birdLevel(level) { if (birdAudio) birdAudio.volume = level > 0 ? Math.min(1, 0.25 + 0.75 * level) : 0; }
function resetMap() {
  if (audioOn) toggleListen();
  stopBird(); closeCard();
  document.getElementById('species-select').value = '';
  applySpeciesFilter('');
  resetView();
}
function hideXC() {
  const g = document.getElementById('xc-layer'); if (g) g.innerHTML = '';
  const lg = document.getElementById('xc-legend'); if (lg) lg.textContent = '';
}
function showXC(key) {
  hideXC();
  if (!key || !audioOn) return;
  const g = document.getElementById('xc-layer'); if (!g) return;
  const sp = speciesData.speciesList.find(x => x.key === key); if (!sp) return;
  const xs = sp.xs || {}, pts = sp.xp || [], pc = speciesData.presentCounts[key] || {};
  const NS = 'http://www.w3.org/2000/svg';
  document.querySelectorAll('#turkey-svg .il').forEach(p => {
    const il = p.getAttribute('data-il');
    const has = xs[il] > 0, seen = pc[il] > 0;
    if (!has && !seen) return;
    const c = document.createElementNS(NS, 'path'); c.setAttribute('d', p.getAttribute('d'));
    c.setAttribute('class', has ? 'xc-has' : 'xc-sil'); g.appendChild(c);
  });
  pts.forEach(q => { const c = document.createElementNS(NS, 'circle');
    c.setAttribute('cx', mx(q[0]).toFixed(1)); c.setAttribute('cy', my(q[1]).toFixed(1)); c.setAttribute("r", 3.4);
    c.setAttribute('class', 'xc-dot'); g.appendChild(c); });
  const lg = document.getElementById('xc-legend');
  if (lg) lg.textContent = pts.length ? t('xc_legend') : t('xc_none');
}

function stopTravel() {
  hideXC();
  if (travelInterval) clearInterval(travelInterval);
  travelInterval = null;
  document.querySelectorAll('#turkey-svg .il.now').forEach(p => p.classList.remove('now'));
  document.querySelectorAll('#species-waveform .sbar.cur').forEach(b => b.classList.remove('cur'));
  const now = document.getElementById('species-now'); if (now) now.textContent = '';
}

function startTravel(counts, maxCount, key) {
  stopTravel();
  if (audioOn) { stopBird(); if (key) birdStart(key); } else stopBird();
  buildProfile(counts, maxCount, key);
  showXC(key);
  const xsNow = ((speciesData.speciesList.find(x => x.key === key) || {}).xs) || {};
  travelIdx = 0;
  const bars = document.querySelectorAll('#species-waveform .sbar');
  const paths = {};
  document.querySelectorAll('#turkey-svg .il').forEach(p => paths[p.getAttribute('data-il')] = p);
  const now = document.getElementById('species-now');
  travelInterval = setInterval(() => {
    const i = travelIdx % ilOrderWestEast.length, il = ilOrderWestEast[i];
    document.querySelectorAll('#turkey-svg .il.now').forEach(p => p.classList.remove('now'));
    document.querySelectorAll('#species-waveform .sbar.cur').forEach(b => b.classList.remove('cur'));
    if (paths[il]) paths[il].classList.add('now');
    if (bars[i]) bars[i].classList.add('cur');
    const c = counts[il] || 0;
    now.textContent = '→ ' + il + ' · ' + (c ? t('now_rec', fmt(c)) : t('now_none')) + (key && audioOn ? ' · ' + t('now_xc', xsNow[il] || 0) : '');
    if (birdAudio) birdLevel(levels[i]); else playTone(levels[i]);
    travelIdx++;
  }, 190);
}

function currentCounts() {
  if (selectedSpecies) {
    const c = speciesData.presentCounts[selectedSpecies] || {};
    return [c, Math.max(1, ...Object.values(c))];
  }
  const c = {}; ilNames.forEach(n => c[n] = ilStats[n].records);
  return [c, Math.max(...Object.values(c))];
}

function toggleListen() {
  audioOn = !audioOn;
  const btn = document.getElementById('listen-btn');
  btn.classList.toggle('on', audioOn);
  btn.textContent = audioOn ? t('stop') : t('listen');
  if (!audioOn) { stopBird(); hideXC(); }
  if (audioOn) {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const [c, m] = currentCounts();
    startTravel(c, m, selectedSpecies);
  } else {
    stopBird();
    stopTravel();
    if (selectedSpecies) { const [c, m] = currentCounts(); buildProfile(c, m, selectedSpecies); }
    else document.getElementById('species-waveform').innerHTML = '';
  }
}

function applySpeciesFilter(key) {
  selectedSpecies = key;
  const mb = document.getElementById('meet-btn'); if (mb) mb.hidden = !key;
  const svg = document.getElementById('turkey-svg');
  const label = document.getElementById('species-waveform-label');
  document.querySelectorAll('#turkey-svg .il').forEach(p => { p.classList.remove('present', 'missing', 'ghost'); p.style.removeProperty('--s'); });

  if (!key) {
    svg.classList.remove('species-mode');
    svg.classList.add('density-mode');
    renderLegend();
    label.textContent = '';
    stopTravel();
    document.getElementById('species-waveform').innerHTML = '';
    if (audioOn) { const [c, m] = currentCounts(); startTravel(c, m, ''); }
    return;
  }

  svg.classList.remove('density-mode');
  svg.classList.add('species-mode');
  const counts = speciesData.presentCounts[key] || {};
  const maxCount = Math.max(1, ...Object.values(counts));
  let nP = 0, nG = 0, nM = 0;
  document.querySelectorAll('#turkey-svg .il').forEach(p => {
    const il = p.getAttribute('data-il');
    if (counts[il] > 0) {
      p.classList.add('present'); nP++;
      const lv = Math.log1p(counts[il]) / Math.log1p(maxCount);
      p.style.setProperty('--s', SP_COLORS[Math.min(4, Math.floor(lv * 5))]);
    }
    else if (neighbourHas(key, il)) { p.classList.add('ghost'); nG++; }
    else { p.classList.add('missing'); nM++; }
  });
  lastN = {nP, nG, nM};
  renderLegend();

  const meta = speciesData.speciesList.find(s => s.key === key);
  renderLabel();
  stopTravel(); stopBird();
  if (audioOn) startTravel(counts, maxCount, key);   // hareket/ses sadece 'Dinle' açıkken
  else buildProfile(counts, maxCount, key);          // kapalıyken sadece sabit profil çubukları
  if (selectedIl) selectIl(selectedIl);
}

let protReady = false, protSel = -1;
function initProt() {
  const svg = document.getElementById('prot-svg'), src = document.getElementById('turkey-svg');
  const first = svg.firstChild;
  src.querySelectorAll('path.il').forEach(p => {
    const c = p.cloneNode(true); c.removeAttribute('id'); c.setAttribute('class', 'il'); c.classList.remove('sel'); svg.insertBefore(c, first);

}
function renderProt() {
  if (!protReady) return;
  const NS = 'http://www.w3.org/2000/svg', sites = PROT_SITES || [], F = PROT_FACTS;
  const tot = F.pub + F.hidden, pct = (F.pub / tot * 100);

    '<div class="hid"><b>' + fmt(F.hidden) + '</b><div class="nm">' + t('pr_t3') + '</div><div class="prot-bar"><i style="width:' + pct.toFixed(2) + '%"></i></div><div class="sb">' + t('pr_t3s') + '</div></div>';
  const il = new Set(sites.map(x => x.il).filter(Boolean));
  document.getElementById('prot-cov').textContent = t('pr_cov', il.size, sites.length);

    const c = document.createElementNS(NS, 'circle');
    c.setAttribute('cx', mx(x.lon).toFixed(1)); c.setAttribute('cy', my(x.lat).toFixed(1));
    c.setAttribute('r', Math.max(3, Math.min(9, 2 + Math.sqrt(x.a || 1) / 5)).toFixed(1));
    c.setAttribute('class', 'pd' + (i === protSel ? ' on' : ''));
    const ti = document.createElementNS(NS, 'title'); ti.textContent = x.n + ' · ' + (t('pr_types')[x.k] || x.t || ''); c.appendChild(ti);
    c.addEventListener('click', () => { protSel = i; renderProt(); });

  });
  const th = t('pr_th'), ty = t('pr_types');

    '<div class="row' + (i === protSel ? ' on' : '') + '" onclick="protSel=' + i + ';renderProt()"><span>' + esc(x.n) + '</span><span>' + (x.a ? fmt(x.a) + ' km²' : '') + '</span><small>' + esc(ty[x.k] || x.t || '') + (x.il ? ' · ' + esc(x.il) : '') + '</small></div>').join('')

}

/* --- exhibition mode: after IDLE seconds without touch, a self-running demo tour --- */
let idleT = null, touring = false, tourT = null, tourI = 0, tourRound = 0;
const IDLE_MS = (parseFloat(new URLSearchParams(location.search).get('idle')) || 45) * 1000;
const STEP_MS = 9000;
function tourPickSpecies() {
  const top = [...speciesData.speciesList].sort((a, b) => b.national - a.national).slice(0, 60)
    .filter(sp => Object.keys(ilStats).filter(il => !presentIn(sp.key, il) && neighbourHas(sp.key, il)).length >= 3);
  return top.length ? top[(tourRound * 7) % Math.min(top.length, 20)] : speciesData.speciesList[0];
}
function tourCap(txt) { document.getElementById('tour-txt').textContent = txt; }
function tourReset() {
  if (selectedSpecies) { document.getElementById('species-select').value = ''; applySpeciesFilter(''); }
  resetView();
}
const TOUR = [
  () => { tourReset(); setTab('map'); tourCap(t('tour_1')); },
  () => { const sp = tourPickSpecies(); document.getElementById('species-select').value = sp.key; applySpeciesFilter(sp.key); tourCap(t('tour_2', spName(sp))); },
  () => {
    tourReset();
    const quiet = Object.keys(ilStats).filter(il => ilStats[il].nb.length >= 2).sort((a, b) => ilStats[a].records - ilStats[b].records).slice(0, 14);
    const il = quiet[(tourRound * 5) % quiet.length]; selectIl(il); tourCap(t('tour_3', il));
  },
  () => { tourReset(); setTab('mig'); setSeason('autumn'); tourCap(t('tour_4')); },
  () => { setSeason('spring'); tourCap(t('tour_5')); },
  () => { tourReset(); setTab('prot'); tourCap(t('tour_7')); },
  () => { tourReset(); setTab('map'); tourCap(t('tour_6')); }
];
function startTour() {
  const it = document.getElementById('intro'); if (it) { it.remove(); }
  closeMember(); closeCard();
  touring = true; document.body.classList.add('touring'); tourI = 0;
  (function next() {
    if (!touring) return;
    TOUR[tourI](); tourI++;
    if (tourI >= TOUR.length) { tourI = 0; tourRound++; }
    tourT = setTimeout(next, STEP_MS);
  })();
}
function stopTour() {
  touring = false; clearTimeout(tourT); document.body.classList.remove('touring');
  tourReset(); setTab('map');
}
function bumpIdle() {
  if (touring) stopTour();
  clearTimeout(idleT); idleT = setTimeout(startTour, IDLE_MS);
}
function initKiosk() {
  ['pointerdown', 'keydown', 'wheel', 'touchstart'].forEach(ev => document.addEventListener(ev, bumpIdle, { passive: true }));
  idleT = setTimeout(startTour, IDLE_MS);
}

  fh:'Que faire ?', f:[['Événements d\'observation ciblés','Organiser des comptages et des journées d\'observation dans les provinces à indice de silence élevé.'],['Groupes locaux et formation','Animer des ateliers eBird et iNaturalist avec des universités, associations et groupes locaux.'],['Surveillance acoustique passive','Installer des enregistreurs automatiques pour augmenter les données sonores.'],['Rendre visibles les données existantes','Verser dans des bases ouvertes les données des carnets, musées et archives institutionnelles.']],
  yh:'Que pouvez-vous faire ?', y:['Saisir une liste complète sur eBird : toutes les espèces vues, la durée et la distance.','Ajouter une observation avec photo et localisation sur iNaturalist.','Enregistrer le chant d\'un oiseau et le déposer sur Xeno-canto.','Planifier une journée d\'observation dans une province silencieuse de la carte, ou près d\'elle.'],
  note:'Cette page propose une méthode ; ce n\'est pas une analyse définitive des causes.' },
 es:{ intro:'El silencio viene menos de la naturaleza que del esfuerzo de observación. Estas son posibles causas (hipótesis); el índice de silencio muestra algunas con datos y el resto requiere conocimiento local.',
  ch:'¿Por qué hay silencio?', c:[['Pocos observadores','Los registros los introducen personas. Las provincias con menos población, o con una cultura de observación de aves más reciente, tienen menos registros.'],['Acceso','El terreno y las condiciones de transporte hacen que algunas zonas se visiten muy poco.'],['Plataformas y costumbres','El uso de eBird e iNaturalist varía entre regiones. Muchas observaciones se quedan en cuadernos y grupos y no llegan a bases abiertas como GBIF.'],['Datos cerrados','Algunos registros (por ejemplo la mayoría de los datos de áreas protegidas) no son públicos.'],['Un obstáculo más para el sonido','Grabar requiere equipo y conocimientos, y subir a Xeno-canto es un paso extra. Por eso los datos de sonido son aún más escasos que los de observación.']],
  fh:'¿Qué se puede hacer?', f:[['Jornadas de observación dirigidas','Organizar conteos y jornadas de observación en provincias con un índice de silencio alto.'],['Grupos locales y formación','Hacer talleres de eBird e iNaturalist con universidades, asociaciones y grupos locales.'],['Monitoreo acústico pasivo','Dejar grabadoras automáticas para aumentar los datos de sonido.'],['Hacer visibles los datos existentes','Pasar registros de cuadernos, museos y archivos institucionales a bases de datos abiertas.']],
  yh:'¿Qué puedes hacer tú?', y:['Envía una lista completa a eBird: cada especie que veas, más la duración y la distancia.','Añade una observación con foto y ubicación en iNaturalist.','Graba el ave que oyes y súbela a Xeno-canto.','Planifica una jornada de observación en una provincia silenciosa del mapa, o cerca de ella.'],
  note:'Esta página propone un método; no es un análisis definitivo de las causas.' },
 de:{ intro:'Stille entsteht weniger aus der Natur als aus dem Beobachtungsaufwand. Dies sind mögliche Ursachen (Hypothesen); der Schweigeindex zeigt einen Teil davon mit Daten, der Rest braucht lokales Wissen.',
  ch:'Woher kommt die Stille?', c:[['Wenige Beobachter','Meldungen werden von Menschen eingegeben. Provinzen mit weniger Einwohnern oder einer jüngeren Vogelbeobachtungskultur haben weniger Meldungen.'],['Zugang','Gelände und Verkehrsbedingungen führen dazu, dass manche Gebiete selten besucht werden.'],['Plattformen und Gewohnheiten','Die Nutzung von eBird und iNaturalist unterscheidet sich je nach Region. Viele Beobachtungen bleiben in Notizbüchern und Gruppen und erreichen offene Datenbanken wie GBIF nie.'],['Geschlossene Daten','Manche Daten (z. B. die meisten Schutzgebietsdaten) sind nicht öffentlich.'],['Ein zusätzliches Hindernis beim Ton','Aufnahmen brauchen Ausrüstung und Know-how, und der Upload zu Xeno-canto ist ein weiterer Schritt. Deshalb sind Tondaten noch seltener als Beobachtungsdaten.']],
  fh:'Was lässt sich tun?', f:[['Gezielte Beobachtungsaktionen','Zählungen und Beobachtungstage in Provinzen mit hohem Schweigeindex organisieren.'],['Lokale Gruppen und Schulung','eBird- und iNaturalist-Workshops mit Universitäten, Vereinen und lokalen Gruppen durchführen.'],['Passives akustisches Monitoring','Automatische Rekorder aufstellen, um Tondaten zu erhöhen.'],['Vorhandene Daten sichtbar machen','Meldungen aus Notizbüchern, Museen und Institutsarchiven in offene Datenbanken überführen.']],
  yh:'Was kannst du tun?', y:['Gib auf eBird eine vollständige Liste ein: jede gesehene Art samt Dauer und Strecke.','Füge auf iNaturalist eine Beobachtung mit Foto und Standort hinzu.','Nimm den Vogel auf, den du hörst, und lade ihn auf Xeno-canto hoch.','Plane einen Beobachtungstag in oder nahe einer stillen Provinz auf der Karte.'],
  note:'Diese Seite ist ein Methodenvorschlag, keine abschließende Ursachenanalyse.' }
};
function renderWhy() {
  const el = document.getElementById('why-body'); if (!el) return;
  const w = WHY[LANG] || WHY.en;
  const li = a => '<ul class="why-list">' + a.map(x => '<li><b>' + x[0] + '.</b> ' + x[1] + '</li>').join('') + '</ul>';
  el.innerHTML = '<p>' + w.intro + '</p><h3>' + w.ch + '</h3>' + li(w.c) + '<h3>' + w.fh + '</h3>' + li(w.f) +
    '<h3>' + w.yh + '</h3><ul class="why-list">' + w.y.map(x => '<li>' + x + '</li>').join('') + '</ul><p class="fine">' + w.note + '</p>';
}
